[project]
name = "api-pokemon"
version = "0.1.0"
description = ""
authors = [
    {name = "Pedro Américo",email = "pedrobravo1406@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "redis (>=8.1.0,<9.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "pymysql (>=1.2.3,<2.0.0)",
    "cryptography (>=50.0.1,<51.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "fakeredis (>=2.38.0,<3.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]
